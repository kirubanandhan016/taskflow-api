name: Python tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: taskflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d taskflow_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/taskflow_test
      JWT_SECRET_KEY: ci-only-taskflow-signing-secret-never-use-outside-ci
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run API tests
        run: python -m pytest -v
      - name: Verify PostgreSQL application startup and schema
        run: |
          python - <<'PY'
          import os
          from fastapi.testclient import TestClient
          from sqlalchemy import create_engine, inspect
          from app.main import create_app

          database_url = os.environ["DATABASE_URL"]
          app = create_app(
              database_url=database_url,
              secret_key=os.environ["JWT_SECRET_KEY"],
          )
          with TestClient(app) as client:
              assert client.get("/docs").status_code == 200
          engine = create_engine(database_url)
          tables = set(inspect(engine).get_table_names())
          assert {"users", "tasks"}.issubset(tables), tables
          print(f"PostgreSQL tables verified: {sorted(tables)}")
          engine.dispose()
          PY
